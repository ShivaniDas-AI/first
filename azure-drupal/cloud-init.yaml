#cloud-config
# Installs Apache + MariaDB + PHP 8.3 + Drupal 11 on Ubuntu 24.04.
# Generated credentials are written to /root/drupal-credentials.txt on the VM.
package_update: true
packages:
  - apache2
  - mariadb-server
  - php8.3
  - libapache2-mod-php8.3
  - php8.3-mysql
  - php8.3-gd
  - php8.3-xml
  - php8.3-mbstring
  - php8.3-curl
  - php8.3-zip
  - php8.3-opcache
  - php8.3-intl
  - unzip
  - git
  - curl

write_files:
  - path: /etc/apache2/sites-available/drupal.conf
    content: |
      <VirtualHost *:80>
          DocumentRoot /var/www/drupal/web
          <Directory /var/www/drupal/web>
              AllowOverride All
              Require all granted
          </Directory>
          ErrorLog ${APACHE_LOG_DIR}/drupal_error.log
          CustomLog ${APACHE_LOG_DIR}/drupal_access.log combined
      </VirtualHost>
  - path: /usr/local/bin/install-drupal.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euxo pipefail
      export HOME=/root COMPOSER_ALLOW_SUPERUSER=1

      DB_PASS=$(openssl rand -hex 16)
      ADMIN_PASS=$(openssl rand -hex 12)

      mysql -e "CREATE DATABASE IF NOT EXISTS drupal CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
      mysql -e "CREATE USER IF NOT EXISTS 'drupal'@'localhost' IDENTIFIED BY '${DB_PASS}';"
      mysql -e "GRANT ALL PRIVILEGES ON drupal.* TO 'drupal'@'localhost'; FLUSH PRIVILEGES;"

      curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      composer create-project drupal/recommended-project /var/www/drupal --no-interaction
      cd /var/www/drupal
      composer require drush/drush --no-interaction

      vendor/bin/drush site:install standard -y \
        --db-url="mysql://drupal:${DB_PASS}@localhost/drupal" \
        --site-name="My Drupal Site" \
        --account-name=admin --account-pass="${ADMIN_PASS}"

      chown -R www-data:www-data /var/www/drupal/web/sites/default/files

      a2enmod rewrite
      a2dissite 000-default
      a2ensite drupal
      systemctl reload apache2

      umask 077
      cat > /root/drupal-credentials.txt <<CREDS
      Drupal admin user: admin
      Drupal admin password: ${ADMIN_PASS}
      MariaDB database/user: drupal / drupal
      MariaDB password: ${DB_PASS}
      CREDS

runcmd:
  - /usr/local/bin/install-drupal.sh > /var/log/install-drupal.log 2>&1
